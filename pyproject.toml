[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "la-traffic-gnn"
version = "0.1.0"
description = "GCN+LSTM traffic speed forecasting on METR-LA"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "h5py>=3.8",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "gdown>=4.7",
]

[project.optional-dependencies]
dev = ["jupyter", "ipykernel", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
